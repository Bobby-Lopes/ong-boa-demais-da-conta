<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONG Boa Demais da Conta</title>

    <link rel="stylesheet" href="../css/style.css">

    <!-- Biblioteca externa utilizada para máscaras de entrada -->
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/imask/7.6.1/imask.min.js"
        defer
    ></script>

    <!-- Arquivo principal da aplicação utilizando ES6 Modules -->
    <script
        type="module"
        src="../js/app.js"
    ></script>
</head>
<body>
    <header>
        <h1>ONG Boa Demais da Conta</h1>

        <button
            class="menu-hamburguer"
            type="button"
            aria-label="Abrir menu"
            aria-expanded="false"
            aria-controls="menu-principal"
        >
            ☰
        </button>

        <nav
            class="menu-principal"
            id="menu-principal"
            aria-label="Navegação principal"
        >
            <ul>
                <li>
                    <a href="#inicio" data-rota="inicio">
                        Início
                    </a>
                </li>

                <li class="dropdown">
                    <a href="#projetos" data-rota="projetos">
                        Projetos
                    </a>

                    <ul class="submenu">
                        <li>
                            <a href="#projetos" data-rota="projetos">
                                Educação Digital
                            </a>
                        </li>
                        <li>
                            <a href="#projetos" data-rota="projetos">
                                Campanha de Arrecadação
                            </a>
                        </li>
                        <li>
                            <a href="#projetos" data-rota="projetos">
                                Voluntariado
                            </a>
                        </li>
                    </ul>
                </li>

                <li>
                    <a href="#cadastro" data-rota="cadastro">
                        Seja um colaborador
                    </a>
                </li>
            </ul>
        </nav>

        <button
            class="botao-tema"
            type="button"
            aria-label="Ativar modo escuro"
            aria-pressed="false"
        >
            🌙 Modo escuro
        </button>
    </header>

    <!-- Conteúdo da SPA será renderizado aqui -->
    <main
        id="conteudo-principal"
        tabindex="-1"
    ></main>

    <!-- Modal utilizado pelos projetos -->
    <div
        class="modal"
        id="modal-projeto"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-titulo"
        aria-describedby="modal-texto"
        hidden
    >
        <div class="modal-conteudo">
            <button
                class="modal-fechar"
                type="button"
                aria-label="Fechar modal"
                data-fechar-modal
            >
                &times;
            </button>

            <h2 id="modal-titulo">Informações do projeto</h2>
            <p id="modal-texto"></p>

            <button
                type="button"
                data-fechar-modal
            >
                Fechar
            </button>
        </div>
    </div>

    <!-- Toast utilizado como feedback -->
    <div
        class="toast"
        id="toast"
        role="status"
        aria-live="polite"
    >
        Projeto selecionado com sucesso!
    </div>

    <footer>
        <p>&copy; 2026 ONG Boa Demais da Conta. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
